<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Diccionario</title>
  
  <style>
    /* Estilos extraídos de CSS */
    body {
      font-family: Arial, sans-serif;
      background:
      margin: 0;
    }

    .wrap {
      max-width: 420px;
      margin: auto;
      padding: 10px;
      text-align: center;
    }

    .cover {
      width: 100%;
      border-radius: 18px;
    }

    button {
      padding: 10px 16px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13);
      font-size: 20px;
      font-weight: bold;
    }

    #play {
      font-size: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 9px 0;
      width: 100%;
      max-width: 320px;
      border-radius: 15px;
      cursor: pointer;
    }

    .jump {
      display: block;
      width: 100%;
      margin: 0;
      background: #3b7ddd;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .active {
      background: #ff8c1a !important;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 140, 26, 0.8);
    }

    input[type="range"] {
      width: 100%;
      margin-top: 10px;
    }

    #cur,
    #dur {
      font-size: 18px;
      font-weight: bold;
    }

    #buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    /* Estilos para el botón de imagen al final */
    .contenedor-enlace-web {
      text-align: center;
      margin-top: 25px; 
      margin-bottom: 15px;
      width: 100%;
    }

    .enlace-imagen {
      display: inline-block;
      text-decoration: none;
    }

    .imagen-boton {
      max-width: 260px; /* Ancho de la imagen en pantalla */
      width: 100%;       /* Se ajusta en pantallas pequeñas */
      height: auto;
      display: block;
      margin: 0 auto;
      transition: transform 0.2s ease;
    }

    .imagen-boton:hover {
      transform: scale(1.05); /* Efecto al pasar el cursor */
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <img src="portada.png" class="cover" alt="Portada">
    
    <audio id="a" src="audio.mp3"></audio>
    
    <button id="play">▶ Hear</button>
    
    <input id="prog" type="range" min="0" value="0">
    
    <div>
      <span id="cur">0:00</span> / <span id="dur">0:00</span>
    </div>

    <!-- Contenedor para la lista de capítulos/secciones -->
    <div id="buttons"></div>

    <!-- BOTÓN FINAL CON IMAGEN (NUEVO) -->
    <div class="contenedor-enlace-web">
      <!-- Cambia '#' por la dirección de la página destino -->
      <a href="https://readmindbk.github.io/WEB/" class="enlace-imagen" target="_blank">
        <!-- Cambia 'web.png' por la ruta de la imagen de tu botón -->
        <img class="imagen-boton" src="web.png" alt="Sitio Web">
      </a>
    </div>
  </div>

  <script>
const sections = [
  {t: 0, n: '1 Sphinx'}, {t: 30, n: '2 Anubis'}, {t: 47, n: '3 Manticore'}, {t: 62, n: '4 Cerberus'}, {t: 80, n: '5 Phoenix'},
  {t: 97, n: '6 Jellyfish'}, {t: 114, n: '7 Hydra'}, {t: 131, n: '8 Minotaur'}, {t: 149, n: '9 Chimera'}, {t: 165, n: '10 Cyclops'},
  {t: 184, n: '11 Dragon'}, {t: 203, n: '12 Werewolf'}, {t: 221, n: '13 Vampire'}, {t: 240, n: '14 Gargoyle'}, {t: 260, n: '15 Faun'},
  {t: 276, n: '16 Jörmungandr'}, {t: 294, n: '17 Kraken'}, {t: 312, n: '18 Dullahan'}, {t: 332, n: '19 Banshee'}, {t: 351, n: '20 Selkie'},
  {t: 369, n: '21 Tiamat'}, {t: 386, n: '22 Wendigo'}, {t: 405, n: '23 Yeti'}, {t: 421, n: '24 Kitsune'}, {t: 438, n: '25 Kappa'},
  {t: 457, n: '26 Oni'}, {t: 477, n: '27 Chupacabra'}, {t: 500, n: '28 Garuda'}, {t: 517, n: '29 Basilisk'}, {t: 536, n: '30 Alicorn'}
];

    const a = document.getElementById('a');
    const b = document.getElementById('buttons');
    const p = document.getElementById('play');
    const pr = document.getElementById('prog');
    const c = document.getElementById('cur');
    const d = document.getElementById('dur');

    // Crear botones de salto
    sections.forEach((s) => {
      const bt = document.createElement('button');
      bt.className = 'jump';
      bt.textContent = s.n;
      bt.onclick = () => {
        a.currentTime = s.t;
      };
      b.appendChild(bt);
    });

    // Formatear tiempo
    function fmt(x) {
      if (isNaN(x)) return "0:00";
      const min = Math.floor(x / 60);
      const sec = Math.floor(x % 60);
      return `${min}:${String(sec).padStart(2, '0')}`;
    }

    // Botón reproducir/pause
    p.onclick = () => {
      if (a.paused) {
        a.play();
        p.textContent = "⏸ Pause";
        p.animate(
          [
            { transform: "scale(1.2)" },
            { transform: "scale(1.08)" },
            { transform: "scale(1.2)" }
          ],
          { duration: 250 }
        );
      } else {
        a.pause();
        p.textContent = "▶ Hear";
      }
    };

    // Cuando el navegador conoce la duración del audio
    a.addEventListener("loadedmetadata", () => {
      pr.min = 0;
      pr.max = a.duration;
      pr.step = 0.01;
      pr.value = 0;

      c.textContent = fmt(0);
      d.textContent = fmt(a.duration);
    });

    // Actualizar barra y tiempo
    a.addEventListener("timeupdate", () => {
      pr.value = a.currentTime;
      c.textContent = fmt(a.currentTime);

      const activeIndex = sections.filter(s => a.currentTime >= s.t).length - 1;

      document.querySelectorAll(".jump").forEach((btn, i) => {
        btn.classList.toggle("active", i === activeIndex);
      });
    });

    // Permitir mover la barra
    pr.addEventListener("input", () => {
      a.currentTime = Number(pr.value);
    });

    // Cuando termina el audio
    a.addEventListener("ended", () => {
      p.textContent = "▶ Hear";
      pr.value = pr.max;
    });
  </script>
</body>
</html>
